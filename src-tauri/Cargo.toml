[package]
name = "maybe-later-journal"
version = "0.1.0"
description = "Maybe Later journal"
authors = ["you"]
edition = "2021"

[lib]
name = "maybe_later_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-sql = { version = "2", features = ["sqlite"] }
